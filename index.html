		function setupOnboarding(){if(user.name)return;$('#onboarding').classList.remove('hidden');$('#avatarChoices').innerHTML=avatars.map((a,i)=>`<button class="avatar-choice ${i===0?'selected':''}" data-avatar="${a}" aria-label="Choose avatar ${a}"><img src="images/Avatars/${a}" alt=""></button>`).join('');$('#moduleChecks').innerHTML='<span class="empty">Select a course to see its modules.</span>';$('#onUniversity').onchange=()=>{$('#onCourse').value='';renderCourseOptions()};$('#onCourse').onchange=renderModuleOptions;$$('[data-avatar]').forEach(b=>b.onclick=()=>{$$('[data-avatar]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedAvatar=b.dataset.avatar});$('#onNext').onclick=nextOnboarding;$('#onBack').onclick=()=>{if(onboardingStep>1){onboardingStep--;renderOnStep()}}}
		function renderOnStep(){ $$('.onboard-step').forEach(x=>x.classList.toggle('active',+x.dataset.step===onboardingStep));$('#onBack').disabled=onboardingStep===1;$('#onNext').innerHTML=onboardingStep===5?'Start Learning <i class="fa-solid fa-rocket"></i>':'Next <i class="fa-solid fa-arrow-right"></i>';$('#stepText').textContent=`Step ${onboardingStep} of 5 · Build your learning profile.`}
		function nextOnboarding(){if(onboardingStep===1&&!$('#onName').value.trim())return toast('Enter your name to continue.');if(onboardingStep===2&&!getInstitution())return toast('Select a valid institution.');if(onboardingStep===3&&!getSelectedCourse())return toast('Select a course for this institution.');if(onboardingStep<5){onboardingStep++;renderOnStep();return}let institution=getInstitution(),selectedCourse=getSelectedCourse(),chosen=$$('#moduleChecks input:checked'),validModules=selectedCourse?.modules.filter(moduleData=>chosen.some(input=>input.value===moduleData.id))||[];if(!institution||!selectedCourse||!validModules.length)return toast('Choose at least one module from this course.');modules=validModules.map(moduleData=>({id:moduleData.id,name:moduleData.name,topics:[{id:moduleData.id,name:moduleData.name,mastery:0}]}));questions=makeQuestions(modules);put('sq_modules',modules);put('sq_questions',questions);user={name:$('#onName').value.trim(),university:$('#onUniversity').value,universityId:institutionKey($('#onUniversity').value),institutionType:institution.type,courseId:selectedCourse.id,course:selectedCourse.name,degree:selectedCourse.name,year:$('#onYear').value,modules:validModules.map(moduleData=>moduleData.id),avatar:selectedAvatar,level:1,xp:0,streak:0,lastStudyDate:''};put('sq_user',user);$('#onboarding').classList.add('hidden');renderAll()}
		/*  dashboard and shared calculations */
		function mastery(){let all=modules.flatMap(m=>m.topics);return all.length?Math.round(all.reduce((a,t)=>a+t.mastery,0)/all.length):0} function level(){return Math.floor(Math.sqrt((user.xp||0)/100))+1} function xpNext(){return level()*level()*100} function weak(){return modules.flatMap(m=>m.topics.map(t=>({...t,module:m.name}))).filter(t=>t.mastery<60).sort((a,b)=>a.mastery-b.mastery)}
		function greeting(){let h=new Date().getHours();return `${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}, ${user.name||'Learner'} 👋`}
		function dashboard(){let w=weak().slice(0,5), weakModule=(w[0]?.module||modules[0].name);$('#dashboardPage').innerHTML=`<div class="grid stats"><article class="stat"><span class="eyebrow">Momentum</span><strong class="flame ${user.streak>7?'pulse':''}">🔥 ${user.streak||0}-day streak</strong><small>Keep the chain alive.</small></article><article class="stat"><span class="eyebrow">Current level</span><strong>Level ${level()}</strong><small>${user.xp||0} / ${xpNext()} XP to next level</small><div class="progress-track" style="margin-top:12px"><i style="width:${Math.min(100,(user.xp||0)/xpNext()*100)}%"></i></div></article><article class="stat"><span class="eyebrow">Overall mastery</span><strong>${mastery()}%</strong><small>Across ${modules.flatMap(m=>m.topics).length} study topics</small></article></div><div class="section-title"><h2>Weak areas</h2><a data-page="progress">View progress <i class="fa-solid fa-arrow-right"></i></a></div><div class="grid two-col"><article class="card"><div class="weak-list">${w.length?w.map(t=>`<div class="weak-row"><span class="topic-label"><i class="dot ${t.mastery>=50?'orange':''} ${t.mastery>=70?'yellow':''}"></i>${t.name}<small> · ${t.module}</small></span><strong>${Math.round(t.mastery)}%</strong></div>`).join(''):'<div class="empty">You have no weak areas yet. Nice work!</div>'}</div></article><article class="card mission"><span class="eyebrow">Today's mission</span><h2>Complete 10 ${weakModule} questions</h2><p>Turn your weakest area into your next strength.</p><button class="primary-btn" data-mode="daily">Start mission <i class="fa-solid fa-arrow-right"></i></button></article></div><div class="section-title"><h2>Choose your challenge</h2></div><div class="grid mode-grid">${modeCard('daily','fa-sun','Daily Challenge','10 questions · +50 XP')} ${modeCard('speed','fa-stopwatch','Speed Run','60 seconds')} ${modeCard('survival','fa-heart-pulse','Survival','One life')} ${modeCard('boss','fa-skull','Boss Battle','5 hard questions')}</div>`;bindModes()}
		function modeCard(id,icon,name,sub){let image={daily:'gear.png',speed:'Timer.png',survival:'heartbeat.png',boss:'skull.png'}[id];return`<button class="mode-btn" data-mode="${id}"><img class="challenge-icon" src="images/${image}" alt=""><span>${name}</span><small>${sub}</small></button>`}
		function play(){ $('#playPage').innerHTML=`<div class="card"><span class="eyebrow">Game modes</span><h2 style="color:var(--text-0)">Pick your next challenge</h2><p style="color:var(--text-2)">Every answer builds your mastery and your level.</p><div class="grid mode-grid" style="margin-top:22px">${modeCard('daily','fa-sun','Daily Challenge','10 questions · +50 XP')} ${modeCard('speed','fa-stopwatch','Speed Run','60 seconds')} ${modeCard('survival','fa-heart-pulse','Survival','One life')} ${modeCard('boss','fa-skull','Boss Battle','5 hard questions')}</div></div>`;bindModes()}
		function bindModes(){$$('[data-mode]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.mode))}
		/*  reusable quiz engine, XP, mastery, streaks and badges */
		function startQuiz(mode){let pool=questions.filter(q=>mode==='boss'?q.difficulty==='hard':true).sort(()=>Math.random()-.5);let count=mode==='boss'?5:mode==='daily'?10:pool.length;currentQuiz={mode,items:pool.slice(0,count),index:0,score:0,xp:0,answered:false,correctStreak:0,total:0};showPage('quiz');if(mode==='speed'||mode==='boss')startTimer(mode==='speed'?60:180);renderQuiz()}
		function startTimer(seconds){let end=Date.now()+seconds*1000;clearInterval(timerId);timerId=setInterval(()=>{if(!currentQuiz)return;let left=Math.max(0,Math.ceil((end-Date.now())/1000));currentQuiz.time=left;if(left<=0){clearInterval(timerId);finishQuiz()}else renderQuizTop()},250)}
		function renderQuizTop(){let q=currentQuiz,$top=$('#quizTop');if(!$top)return;$top.querySelector('.timer').textContent=q.mode==='speed'||q.mode==='boss'?formatTime(q.time||0):'';$top.querySelector('.progress-track i').style.width=(q.index/q.items.length*100)+'%'}function formatTime(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
		function renderQuiz(){let q=currentQuiz,item=q.items[q.index];if(!item)return finishQuiz();$('#quizPage').innerHTML=`<div class="quiz-wrap"><div class="quiz-top" id="quizTop"><strong>Question ${q.index+1} of ${q.items.length}</strong><div class="progress-track"><i style="width:${q.index/q.items.length*100}%"></i></div><span class="timer">${q.mode==='speed'||q.mode==='boss'?formatTime(q.time||0):''}</span></div><article class="question-card card"><span class="eyebrow">${item.difficulty} · ${modules.find(m=>m.id===item.moduleId)?.name||'StudyQuest'}</span><h2>${item.question}</h2><div class="options">${item.options.map((o,i)=>`<button class="option" data-answer="${i}"><span class="letter">${'ABCD'[i]}</span>${o}</button>`).join('')}</div><div id="explanation"></div></article><div class="quiz-actions"><button class="primary-btn hidden" id="nextQuestion">Next question <i class="fa-solid fa-arrow-right"></i></button></div></div>`;$$('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer,item));$('#nextQuestion').onclick=()=>{currentQuiz.index++;currentQuiz.answered=false;renderQuiz()};}
		function answer(choice,item){if(currentQuiz.answered)return;currentQuiz.answered=true;let correct=choice===item.correct;currentQuiz.total++;if(correct){currentQuiz.score++;currentQuiz.correctStreak++;let points={easy:10,medium:20,hard:30,exam:50}[item.difficulty];currentQuiz.xp+=points;showFloat('+'+points+' XP');}else currentQuiz.correctStreak=0;$$('[data-answer]').forEach((b,i)=>{b.disabled=true;if(i===item.correct)b.classList.add('correct');if(i===choice&&!correct)b.classList.add('wrong')});$('#explanation').innerHTML=`<div class="explanation"><strong>${correct?'Correct!':'Keep learning.'}</strong> ${item.explanation}</div>`;$('#nextQuestion').classList.remove('hidden');updateTopic(item,correct);if(!correct&&currentQuiz.mode==='survival')setTimeout(finishQuiz,700);checkBadges()}
		function updateTopic(item,correct){let t=modules.flatMap(m=>m.topics).find(t=>t.id===item.topicId);if(!t)return;t.mastery=Math.max(0,Math.min(100,correct?t.mastery+(100-t.mastery)*.15:t.mastery-t.mastery*.1));put('sq_modules',modules)}
		function finishQuiz(){if(!currentQuiz)return;clearInterval(timerId);let bonus=currentQuiz.mode==='daily'?50:0;let previous=sessions.find(s=>s.mode===currentQuiz.mode)?.score||0;if(currentQuiz.score>previous)bonus+=25;currentQuiz.xp+=bonus;user.xp=(user.xp||0)+currentQuiz.xp;updateStreak();sessions.unshift({mode:currentQuiz.mode,score:currentQuiz.score,total:currentQuiz.total,xp:currentQuiz.xp,date:new Date().toISOString()});sessions=sessions.slice(0,50);put('sq_sessions',sessions);put('sq_user',user);checkBadges();$('#quizPage').innerHTML=`<div class="card result"><span class="eyebrow">${currentQuiz.mode} complete</span><div class="result-score">${currentQuiz.score}/${currentQuiz.total}</div><h2 style="color:var(--text-0)">${currentQuiz.score>=currentQuiz.total*.7?'Quest complete!':'Every attempt counts.'}</h2><p style="color:var(--text-2)">You earned <strong style="color:#fbbf24">+${currentQuiz.xp} XP</strong> · Mastery has been updated.</p><button class="primary-btn" data-mode="${currentQuiz.mode}">Play again</button> <button class="ghost-btn" id="backDash">Dashboard</button></div>`;bindModes();$('#backDash').onclick=()=>showPage('dashboard')}
		function updateStreak(){let today=new Date().toISOString().slice(0,10),last=user.lastStudyDate;if(last===today)return;let diff=last?Math.round((new Date(today)-new Date(last))/86400000):99;user.streak=diff===1?(user.streak||0)+1:1;user.lastStudyDate=today}
		function checkBadges(){let total=sessions.reduce((a,s)=>a+s.total,0)+((currentQuiz?.total)||0),conditions=[sessions.length>0,currentQuiz?.correctStreak>=10,user.streak>=7,total>=100,modules.some(m=>m.topics.some(t=>t.mastery>=90))];badges.forEach((b,i)=>{if(!b.earned&&conditions[i]){b.earned=true;toast('Badge unlocked: '+b.name+' 🏆')}});put('sq_badges',badges)}
		function showFloat(text){let el=document.createElement('div');el.className='float-xp';el.textContent=text;el.style.left='50%';el.style.top='45%';document.body.append(el);setTimeout(()=>el.remove(),1100)}
		/*  progress and modules */
		function progress(){let bars=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let key=d.toISOString().slice(0,10);return{day:d.toLocaleDateString(undefined,{weekday:'short'}),xp:sessions.filter(s=>s.date.slice(0,10)===key).reduce((a,s)=>a+s.xp,0)}});$('#progressPage').innerHTML=`<div class="grid module-grid">${modules.map(m=>`<article class="card module-progress"><div class="ring" style="--value:${Math.round(m.topics.reduce((a,t)=>a+t.mastery,0)/m.topics.length)}%"><span>${Math.round(m.topics.reduce((a,t)=>a+t.mastery,0)/m.topics.length)}%</span></div><div><h3 style="color:var(--text-0);margin-top:0">${m.name}</h3>${m.topics.map(t=>`<div class="topic-line"><span class="topic-label"><i class="dot ${t.mastery>=50?'orange':''} ${t.mastery>=70?'yellow':''}"></i>${t.name}</span><strong>${Math.round(t.mastery)}%</strong></div>`).join('')}</div></article>`).join('')}</div><div class="section-title"><h2>Weekly XP</h2></div><article class="card"><div class="chart">${bars.map(b=>`<div class="bar-col"><span>${b.xp}</span><i class="bar" style="height:${Math.max(4,Math.min(100,b.xp/Math.max(1,...bars.map(x=>x.xp))*100))}%"></i><small>${b.day}</small></div>`).join('')}</div></article><div class="section-title"><h2>Recent sessions</h2></div><article class="card">${sessions.slice(0,10).map(s=>`<div class="topic-line"><span>${s.mode} · ${new Date(s.date).toLocaleDateString()}</span><strong>${s.score}/${s.total} · +${s.xp} XP</strong></div>`).join('')||'<div class="empty">Complete a quiz to see your sessions here.</div>'}</article>`}
		function modulesPage(){ $('#modulesPage').innerHTML=`<div class="grid module-grid">${modules.map(m=>`<article class="card module-card"><span class="eyebrow">Module</span><h3>${m.name}</h3><div class="row"><span>${m.topics.length} topics</span><strong>${Math.round(m.topics.reduce((a,t)=>a+t.mastery,0)/m.topics.length)}%</strong></div><div class="progress-track"><i style="width:${m.topics.reduce((a,t)=>a+t.mastery,0)/m.topics.length}%"></i></div>${m.topics.map(t=>`<div class="topic-line"><span>${t.name}</span><span>${Math.round(t.mastery)}%</span></div>`).join('')}</article>`).join('')}</div>`}
		function settings(){let theme=document.documentElement.dataset.theme==='light',preferences=get('sq_preferences',{sound:true,reminders:true});$('#settingsPage').innerHTML=`<div class="settings-grid"><article class="card settings-card"><span class="eyebrow">Profile</span><h2>Your learning profile</h2><p>Keep your study identity up to date.</p><div class="field"><label for="settingsName">Display name</label><input id="settingsName" value="${(user.name||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" autocomplete="name"></div><div class="field"><label for="settingsYear">Year of study</label><select id="settingsYear">${['1st','2nd','3rd','Honours'].map(year=>`<option ${user.year===year?'selected':''}>${year}</option>`).join('')}</select></div><div class="settings-actions"><button class="primary-btn" id="saveSettings">Save changes <i class="fa-solid fa-check"></i></button><span id="settingsSaved" class="empty"></span></div></article><article class="card settings-card"><span class="eyebrow">Preferences</span><h2>Make StudyQuest yours</h2><p>Choose how the study space behaves.</p><label class="setting-toggle"><span>Light theme<small>Use a brighter workspace.</small></span><input id="settingsTheme" type="checkbox" ${theme?'checked':''}></label><label class="setting-toggle"><span>Sound effects<small>Play feedback sounds during quizzes.</small></span><input id="settingsSound" type="checkbox" ${preferences.sound!==false?'checked':''}></label><label class="setting-toggle"><span>Study reminders<small>Keep your daily momentum visible.</small></span><input id="settingsReminders" type="checkbox" ${preferences.reminders!==false?'checked':''}></label></article><article class="card settings-card"><span class="eyebrow">Danger zone</span><h2>Reset learning data</h2><p>Remove quiz history, XP, mastery, and badges from this browser.</p><button class="danger-btn" id="resetProgress"><i class="fa-solid fa-trash-can"></i> Reset progress</button></article></div>`;$('#saveSettings').onclick=()=>{let name=$('#settingsName').value.trim();if(!name)return toast('Enter a display name first.');user.name=name;user.year=$('#settingsYear').value;put('sq_user',user);$('#settingsSaved').textContent='Saved';setTimeout(()=>$('#settingsSaved').textContent='',1800);$('#pageSubtitle').textContent='Track your progress and keep moving forward.';toast('Profile updated.');};$('#settingsTheme').onchange=e=>setTheme(e.target.checked);$('#settingsSound').onchange=savePreferences;$('#settingsReminders').onchange=savePreferences;$('#resetProgress').onclick=()=>{if(!window.confirm('Reset all learning progress? This cannot be undone.'))return;user={...user,xp:0,streak:0,lastStudyDate:''};modules=makeModules();questions=makeQuestions(modules);sessions=[];badges=badges.map(b=>({...b,earned:false}));put('sq_user',user);put('sq_modules',modules);put('sq_questions',questions);put('sq_sessions',sessions);put('sq_badges',badges);toast('Learning progress reset.');settings()};}
		function savePreferences(){put('sq_preferences',{sound:$('#settingsSound').checked,reminders:$('#settingsReminders').checked});toast('Preferences saved.')} function setTheme(light){document.documentElement.dataset.theme=light?'light':'';$('#themeToggle').innerHTML=`<i class="fa-solid fa-${light?'moon':'sun'}"></i>`;put('sq_theme',light?'light':'dark')}
		/*  leaderboard */
		const mock=[['Maya','woman.png',2840],['Thabo','man.png',2510],['Liam','man (1).png',2200],['Aisha','girl.png',1980],['Noah','panda.png',1760],['Zinhle','profile.png',1550],['Ethan','rabbit.png',1300],['Nandi','cat.png',1100],['Kai','meerkat.png',920],['Leah','woman (1).png',710]];
		function leaderboard(){let rows=mock.map(x=>({name:x[0],avatar:x[1],xp:x[2],me:false}));rows.push({name:user.name||'You',avatar:user.avatar||avatars[0],xp:user.xp||0,me:true});rows.sort((a,b)=>b.xp-a.xp);$('#leaderboardPage').innerHTML=`<div class="tabs"><button class="tab ${leaderboardTab==='Global'?'active':''}" data-tab="Global">Global</button><button class="tab ${leaderboardTab==='My Modules'?'active':''}" data-tab="My Modules">My Modules</button></div><article class="card"><div class="leader-row" style="color:var(--text-2);font-size:11px"><span>#</span><span>Student</span><span>XP</span><span class="level">Level</span></div>${rows.slice(0,10).map((r,i)=>`<div class="leader-row ${r.me?'me':''}">${i<3?`<img class="rank-badge" src="images/${['First place.png','Second place.png','third place.png'][i]}" alt="${['First','Second','Third'][i]} place">`:`<strong>${i+1}</strong>`}<div class="student"><span class="avatar">${r.avatar.endsWith('.png')?`<img src="images/Avatars/${r.avatar}" alt="${r.name} avatar">`:r.avatar}</span><span>${r.name}${r.me?' (you)':''}</span></div><strong>${r.xp.toLocaleString()}</strong><span class="level">Lvl ${Math.floor(Math.sqrt(r.xp/100))+1}</span></div>`).join('')}</article>`;$$('[data-tab]').forEach(b=>b.onclick=()=>{leaderboardTab=b.dataset.tab;leaderboard()})}
		/*  deterministic tutor */
		function tutorResponse(prompt){let low=mastery()<60;let tone=low?'You’re building a solid foundation, so let’s keep it clear and practical.':'You’re progressing well, so let’s raise the bar with a sharper connection.';if(prompt.includes('wrong'))return `${tone} Check the definition first, then eliminate options that are too absolute. Try explaining why the correct option fits in one sentence.`;if(prompt.includes('another'))return `${tone} Here’s a mini challenge: pick one topic below 60% mastery and describe a real-world use for it before checking your notes.`;if(prompt.includes('scratch'))return `${tone} Start with the “what”, then the “why”, then a tiny example. ${weak()[0]?.name||'Your next topic'} is a great place to begin.`;return `${tone} Think of this concept as a rule you can test with examples. What changes when you alter one input or assumption?`}
		function sendChat(text){if(!text.trim())return;$('#messages').insertAdjacentHTML('beforeend',`<div class="msg user">${text.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</div>`);setTimeout(()=>{$('#messages').insertAdjacentHTML('beforeend',`<div class="msg ai">${tutorResponse(text)}</div>`);$('#messages').scrollTop=99999},220)}
		/*  navigation and page rendering */
		function showPage(name){if(name==='quiz'){$('#pageTitle').textContent='Quiz';$('#pageSubtitle').textContent='Make every answer count.'}else{$('#pageTitle').textContent=name[0].toUpperCase()+name.slice(1);$('#pageSubtitle').textContent=name==='dashboard'?greeting():'Track your progress and keep moving forward.'}$$('.page').forEach(p=>p.classList.remove('active'));$('#'+name+'Page').classList.add('active');$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));if(name==='dashboard')dashboard();if(name==='play')play();if(name==='progress')progress();if(name==='leaderboard')leaderboard();if(name==='modules')modulesPage();if(name==='settings')settings()}
		function renderAll(){nav();dashboard();showPage('dashboard')}
		function toast(message){let t=document.createElement('div');t.className='toast';t.innerHTML='<i class="fa-solid fa-circle-check"></i> '+message;$('#toastRegion').append(t);setTimeout(()=>t.remove(),3500)}
		$('#themeToggle').onclick=()=>setTheme(document.documentElement.dataset.theme!=='light');$('#settingsButton').onclick=()=>showPage('settings');$('#chatFab').onclick=()=>$('#chatPanel').classList.toggle('hidden');$('#closeChat').onclick=()=>$('#chatPanel').classList.add('hidden');$$('.chip').forEach(b=>b.onclick=()=>sendChat(b.textContent));$('#chatForm').onsubmit=e=>{e.preventDefault();let i=$('#chatInput');sendChat(i.value);i.value=''};if(get('sq_theme','dark')==='light')setTheme(true);
		nav();setupOnboarding();if(user.name)renderAll();
	</script>
